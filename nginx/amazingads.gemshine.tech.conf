# ==============================================================================
# Nginx Configuration for Amazing Ads Calendar Billing Software
# Domain: amazingads.gemshine.tech
# Place this file at: /etc/nginx/sites-available/amazingads.gemshine.tech
# Enable symlink: ln -s /etc/nginx/sites-available/amazingads.gemshine.tech /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name amazingads.gemshine.tech;

    # Root directory pointing to the React frontend production build
    root /var/www/amazingads-billing/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security & Size Limits
    client_max_body_size 50M;

    # 1. Frontend Client-side Routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. Cache Static Assets (Vite hashed bundles: js, css, images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Backend API Reverse Proxy (Proxy to Node.js / PM2 on Port 5027)
    location /api/ {
        proxy_pass http://127.0.0.1:5027/api/;
        proxy_http_version 1.1;

        # Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (for large PDF generation, invoices & database reports)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

